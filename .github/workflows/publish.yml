name: Publish tiles daily

on:
  schedule:
    # run later to give upstream time; adjust as needed
    - cron: '10 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Decide target dates (all missing from latest to yesterday)
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          test -f snaps.json || echo "[]" > snaps.json
          last=$(jq -r '.[-1].label // empty' snaps.json)
          if [ -n "$last" ]; then
            start=$(date -u -d "$last + 1 day" +%F)
          else
            start=$(date -u -d "2025-08-09" +%F)  # fallback to first known date
          fi
          end=$(date -u -d "yesterday" +%F)
          
          # Generate all dates from start to end
          current="$start"
          dates=""
          while [[ "$current" < "$end" ]] || [[ "$current" == "$end" ]]; do
            dates="$dates$current "
            current=$(date -u -d "$current + 1 day" +%F)
          done
          
          echo "dates=$dates" >> "$GITHUB_OUTPUT"
          echo "Processing dates: $dates"

      - name: Process each missing date
        shell: bash
        run: |
          set -euo pipefail
          dates="${{ steps.dates.outputs.dates }}"
          
          if [ -z "$dates" ]; then
            echo "No dates to process"
            exit 0
          fi
          
          for target in $dates; do
            echo "==== Processing $target ===="
            
            # Find latest asset stem for that date (unauthenticated)
            echo "Looking for assets containing $target"
            curl -sS https://api.github.com/repos/murolem/wplace-archives/releases?per_page=100 > releases.json

            jq --arg d "$target" '
              [.[] | .assets[] | select(.name | test($d) and test("\\.tar\\.gz"))
              | {name: .name, url: .browser_download_url}]
            ' releases.json > assets.json

            if [ ! -s assets.json ] || [ "$(jq 'length' assets.json)" = "0" ]; then
              echo "No matching assets for $target, skipping"
              continue
            fi

            jq '[.[] |
              . as $a | $a.name as $n
              | ($n | sub("\\.tar\\.gz\\.(?:[a-z]{2}|\\d{3})$";"") | sub("\\.tar\\.gz$";"")) as $stem
              | {stem:$stem, name:$a.name, url:$a.url}]
            ' assets.json > withstems.json

            stem=$(jq -r 'sort_by(.name) | reverse | .[0].stem' withstems.json)
            echo "Selected stem: $stem"
            jq -r --arg s "$stem" '.[] | select(.stem==$s) | .url' withstems.json > urls.txt
            echo "URLs to download:"; cat urls.txt
            
            # Download assets
            mkdir -p work
            cd work
            while read -r u; do
              echo "GET $u"
              curl -sS -L --fail -O "$u" || { echo "Download failed, skipping $target"; cd ..; rm -rf work; continue 2; }
            done < ../urls.txt
            ls -l
            
            # Check available disk space before joining
            parts_size=$(du -sb *.tar.gz* 2>/dev/null | awk '{s+=$1} END {print s}')
            avail_space=$(df -B1 . | tail -1 | awk '{print $4}')
            required_space=$((parts_size + parts_size / 10))  # parts + 10% buffer
            
            echo "Parts total: $(numfmt --to=iec-i --suffix=B $parts_size)"
            echo "Available: $(numfmt --to=iec-i --suffix=B $avail_space)"
            echo "Required (with buffer): $(numfmt --to=iec-i --suffix=B $required_space)"
            
            if [ "$avail_space" -lt "$required_space" ]; then
              echo "ERROR: Insufficient disk space for $target (need $(numfmt --to=iec-i --suffix=B $required_space), have $(numfmt --to=iec-i --suffix=B $avail_space))"
              echo "Skipping $target due to low disk space"
              cd ..
              rm -rf work
              continue
            fi
            
            # Join (if split) → archive.tar.gz
            if ls *.tar.gz.* >/dev/null 2>&1; then
              cat $(ls -1 *.tar.gz.* | sort) > archive.tar.gz
            else
              mv *.tar.gz archive.tar.gz
            fi
            ls -lh archive.tar.gz
            
            # Extract left half of Saudi rectangle (z=11 x=1243..1250, y=875..904)
            out="../tiles/tiles_$target"
            mkdir -p "$out"

            # Create a stable listing file first to avoid SIGPIPE/write errors
            listing="listing.txt"
            tar -tzf archive.tar.gz 2>/dev/null > "$listing"

            # Check if archive uses expected z=11 coordinate system (x=1243-1258)
            expected_coords=$(grep -cE "/(1243|1244|1245|1246|1247|1248|1249|1250|1251|1252|1253|1254|1255|1256|1257|1258)/[0-9]+\.png$" "$listing" || true)
            if [ "$expected_coords" -eq 0 ]; then
              echo "WARNING: Archive for $target uses different coordinate system than expected!"
              echo "Expected z=11 tiles with x=1243-1258, but archive appears to use different coordinates."
              echo "Sample paths from archive:"
              head -n 20 "$listing"
              echo ""
              echo "This may indicate upstream format change. Skipping $target."
              echo "Please investigate at: https://github.com/murolem/wplace-archives/releases"
              rm -f "$listing" want.txt
              cd ..
              rm -rf work
              continue
            fi

            # Extract tiles: accept prefix/x/y.png or prefix/11/x/y.png
            # Use simpler awk filter that doesn't rely on prefix regex matching
            awk -F'/' '
              NF >= 3 && $NF ~ /^[0-9]+\.png$/ {
                # Get x from second-to-last field, y from filename
                x = $(NF-1) + 0;
                y = substr($NF, 1, length($NF)-4) + 0;
                # LEFT HALF ONLY: x=1243-1250, y=875-904
                if (x >= 1243 && x <= 1250 && y >= 875 && y <= 904) print $0;
              }
            ' "$listing" > want.txt

            count=$(wc -l < want.txt)
            if [ "$count" -eq 0 ]; then
              echo "No tiles matched for $target; sample listing:"
              head -n 50 "$listing"
              rm -f "$listing" want.txt
              cd ..
              rm -rf work
              continue
            fi

            tar -xzf archive.tar.gz --strip-components=1 -T want.txt -C "$out"
            echo "Extracted $count files into tiles/tiles_$target"
            rm -f "$listing" want.txt
            
            # Cleanup work dir for next iteration
            cd ..
            rm -rf work
            
            # Update snaps.json
            test -f snaps.json || echo "[]" > snaps.json
            tmp=snaps.json.new
            jq --arg d "$target" --arg dir "tiles/tiles_$target" '
              ( . // [] ) as $arr
              | if ($arr | map(.label) | index($d)) then $arr else ($arr + [{"label":$d,"dir":$dir}]) end
            ' snaps.json > "$tmp"
            mv "$tmp" snaps.json
            echo "Updated snaps.json with $target"
          done
          
          jq -r 'length' snaps.json | xargs -I{} echo "snaps.json now has {} entries"

      - name: Commit & push
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: actions@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: actions@users.noreply.github.com
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet snaps.json && [ -z "$(git ls-files --others --exclude-standard tiles/)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git add snaps.json tiles/
          git commit -m "Add tiles for missing dates (left half only)" || exit 0
          git push
